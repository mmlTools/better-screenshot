name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
permissions:
  contents: read
jobs:
  # Pushes no longer build the plugin. Start a build manually from the
  # "Dispatch" workflow (Actions -> Dispatch -> Run workflow -> job: build);
  # pushing a tag afterwards publishes that build via the "Release" workflow.
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read
